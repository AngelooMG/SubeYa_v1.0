<div class="register-container">
    <h2>Crea una Cuenta</h2>
    <p>Regístrate para acceder a las predicciones del Metro de Lima</p>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electronico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required>
      </div>
      
       <div class="form-group">
        <label for="confirmpassword">Confirmar Contraseña</label>
        <input type="password" id="confirmpassword" name="confirmpassword" [(ngModel)]="confirmpassword" required>
      </div>
      
      <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>
    
    <p class="login-link">¿Ya tienes una cuenta? <a href="#">Inicia Sesion</a></p>
  </div>
