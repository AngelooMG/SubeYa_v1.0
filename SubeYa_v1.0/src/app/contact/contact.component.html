<div class="container">
    <h1>Contactanos</h1>
    <p>¿Tienes alguna pregunta o sugerencia? No dudes en escribirnos.</p>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required>
      </div>
      
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" [(ngModel)]="apellido" required>
      </div>
      
      <div class="form-group">
        <label for="correo">Correo Electronico</label>
        <input type="email" id="correo" name="correo" [(ngModel)]="correo" required>
      </div>
      
      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" [(ngModel)]="mensaje" required></textarea>
      </div>
      
      <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
    </form>
  </div>
